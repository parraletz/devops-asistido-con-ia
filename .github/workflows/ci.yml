# CI clásico: la red de seguridad que valida TODO, lo escriba una persona o la IA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  lint-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # El mismo script que usa el skill de Claude: mismas reglas en local, con IA y en CI.
      - name: estándares DevOps (hadolint, shellcheck, terraform, kubeconform, secretos)
        run: .claude/skills/devops-estandares/scripts/validar.sh

  image:
    runs-on: ubuntu-latest
    needs: [app, lint-infra]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker build
        run: docker build -t catalogo-api:${{ github.sha }} app
      - name: smoke test
        run: |
          docker run -d --name smoke -p 3000:3000 catalogo-api:${{ github.sha }}
          for _ in $(seq 1 10); do
            curl -fsS http://localhost:3000/health/live && exit 0
            sleep 1
          done
          docker logs smoke
          exit 1

  # Publica la imagen multi-arquitectura en GHCR solo desde main, después de
  # pasar tests, linters y smoke test. Los PRs nunca publican.
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [image]
    permissions:
      contents: read
      packages: write   # único job con permiso de escritura, y solo sobre GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: versión de la app
        id: version
        run: echo "value=$(jq -r .version app/package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/catalogo-api
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=sha,format=short
            type=raw,value=latest

      # Sin QEMU: el Dockerfile compila en $BUILDPLATFORM y el stage final no tiene RUN.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
